<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sign in to Valhalla</title>
<meta name="description" content="Read-only Solana sign-in for Valhalla. No transaction and no fee.">
<link rel="canonical" href="https://valhalla-app.xyz/connect/">
<link rel="stylesheet" href="../styles.css">
</head>
<body>
<main class="wrap" style="max-width:440px;padding:32px 0 64px">
  <p class="kicker">SIGN IN</p>
  <h1>Sign in to Valhalla</h1>
  <p>Read-only. Valhalla asks the wallet to connect, then to sign a login message. There is no fee and no transaction. Valhalla never asks for a seed phrase.</p>
  <p id="status" role="status">Looking for the wallet.</p>
  <button id="go" type="button">Continue</button>
  <p id="missing" hidden>The wallet was not detected in this tab.</p>
  <a id="download" href="https://phantom.app/download" hidden>Install the wallet</a>
  <p><a href="../">Back to Valhalla</a></p>
</main>
<script src="../site-config.js"></script>
<script src="nacl.min.js"></script>
<script src="connect-core.js"></script>
<script src="connect-page.js"></script>
</body>
</html>
