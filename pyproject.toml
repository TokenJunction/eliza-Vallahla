[tool.ruff]
target-version = "py312"
# Line length is not enforced. These scripts embed HTML and JavaScript literals
# where wrapping the line would make the fixture harder to read than leaving it
# long, so E501 is deliberately absent from the selected rules below.
line-length = 100

[tool.ruff.lint]
# E3 covers blank-line errors, which ruff still marks as preview rules. The ruff
# version is pinned in .github/workflows/python-lint.yml so the rule set cannot
# shift underneath the build without someone changing it deliberately.
preview = true
select = ["E3", "E4", "E7", "E9", "F", "W", "I", "B"]
