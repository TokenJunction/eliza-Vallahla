apiVersion: apps/v1
kind: Deployment
metadata:
  name: valhalla-eliza
  namespace: valhalla
  labels:
    app.kubernetes.io/name: valhalla-eliza
    app.kubernetes.io/component: agent-backend
    app.kubernetes.io/part-of: valhallaos
spec:
  replicas: 0
  revisionHistoryLimit: 3
  progressDeadlineSeconds: 300
  minReadySeconds: 10
  strategy: {type: Recreate}
  selector:
    matchLabels: {app.kubernetes.io/name: valhalla-eliza}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: valhalla-eliza
        app.kubernetes.io/component: agent-backend
        app.kubernetes.io/part-of: valhallaos
    spec:
      automountServiceAccountToken: false
      enableServiceLinks: false
      nodeSelector: {kubernetes.io/os: linux}
      terminationGracePeriodSeconds: 60
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: eliza
          # Build from valhalla-elizaos/Dockerfile and pin a tested digest.
          image: registry.invalid/valhalla/eliza:replace-before-activation
          imagePullPolicy: IfNotPresent
          workingDir: /app
          # Preserve image CMD: bun run start (includes env validation).
          ports:
            - {name: http, containerPort: 10000, protocol: TCP}
          env:
            - {name: NODE_ENV, value: "production"}
            - {name: PORT, value: "10000"}
            - {name: SERVER_PORT, value: "10000"}
            - name: PUBLIC_ORIGIN
              valueFrom:
                configMapKeyRef: {name: valhalla-config, key: PUBLIC_ORIGIN, optional: false}
            - {name: VALHALLA_EXECUTION_MODE, value: "paper"}
            - {name: VALHALLA_TRADING_ENABLED, value: "false"}
            - {name: VALHALLA_SOCIAL_ENABLED, value: "false"}
            - {name: VALHALLA_KEY_STORAGE_ENABLED, value: "false"}
            - {name: ZEUS_IDLE_ENABLED, value: "false"}
            # At least one provider key is required by production validation.
            - name: OPENAI_API_KEY
              valueFrom:
                secretKeyRef: {name: valhalla-eliza-secrets, key: OPENAI_API_KEY, optional: true}
            - name: GOOGLE_GENERATIVE_AI_API_KEY
              valueFrom:
                secretKeyRef: {name: valhalla-eliza-secrets, key: GOOGLE_GENERATIVE_AI_API_KEY, optional: true}
          resources:
            requests: {cpu: "250m", memory: "512Mi"}
            limits: {cpu: "1000m", memory: "1Gi"}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: {drop: [ALL]}
            # Compatibility only; qualify writable paths and persistence.
            readOnlyRootFilesystem: false
          startupProbe:
            tcpSocket: {port: http}
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 48
          # TCP reachability only, not agent or provider readiness.
          readinessProbe:
            tcpSocket: {port: http}
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 3
            successThreshold: 1
          volumeMounts:
            - {name: temporary-files, mountPath: /tmp}
          terminationMessagePolicy: FallbackToLogsOnError
      volumes:
        - name: temporary-files
          emptyDir: {sizeLimit: "256Mi"}
