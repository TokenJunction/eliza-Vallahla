apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: valhalla-api
  namespace: valhalla
  labels:
    app.kubernetes.io/name: valhalla-api
    app.kubernetes.io/component: api-producer
    app.kubernetes.io/part-of: valhallaos

spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: valhalla-api

  # Proposed production bounds; validate capacity and cost.
  minReplicas: 2
  maxReplicas: 6

  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70

  behavior:
    scaleUp:
      stabilizationWindowSeconds: 0
      policies:
        - type: Pods
          value: 2
          periodSeconds: 60

    scaleDown:
      stabilizationWindowSeconds: 300
      policies:
        - type: Pods
          value: 1
          periodSeconds: 60
