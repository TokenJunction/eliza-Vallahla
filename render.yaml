services:
  - type: web
    name: valhalla-elizaos
    runtime: docker
    plan: free
    branch: docs/site
    dockerfilePath: ./valhalla-elizaos/Dockerfile
    dockerContext: ./valhalla-elizaos
    healthCheckPath: /health
    autoDeploy: false
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: "10000"
      - key: VALHALLA_EXECUTION_MODE
        value: paper
      - key: VALHALLA_TRADING_ENABLED
        value: "false"
      - key: VALHALLA_SOCIAL_ENABLED
        value: "false"
      - key: VALHALLA_KEY_STORAGE_ENABLED
        value: "false"
      - key: ZEUS_IDLE_ENABLED
        value: "false"
      - key: PUBLIC_ORIGIN
        value: https://valhalla-app.xyz
      - key: OPENAI_API_KEY
        sync: false
      - key: GOOGLE_GENERATIVE_AI_API_KEY
        sync: false
      - key: LEADER_EMAIL
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_ANON_KEY
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: REDIS_URL
        sync: false
      - key: UPSTASH_REDIS_REST_URL
        sync: false
      - key: UPSTASH_REDIS_REST_TOKEN
        sync: false

  - type: web
    name: valhalla-site
    runtime: node
    plan: free
    branch: docs/site
    buildCommand: npm install --legacy-peer-deps && npm run build
    startCommand: node valhallaMasterEngineV35.js
    healthCheckPath: /healthz
    autoDeploy: false
    envVars:
      - key: NODE_ENV
        value: production
      - key: PUBLIC_ORIGIN
        value: https://valhalla-app.xyz
      - key: VALHALLA_EXECUTION_MODE
        value: paper
      - key: VALHALLA_TRADING_ENABLED
        value: "false"
      - key: VALHALLA_SOCIAL_ENABLED
        value: "false"
      - key: VALHALLA_KEY_STORAGE_ENABLED
        value: "false"
      - key: VALHALLA_QUEUE_ENABLED
        value: "false"
      - key: ELIZA_URL
        sync: false
      - key: VALHALLA_DISPATCH_TOKEN
        sync: false
      - key: REDIS_URL
        sync: false
      - key: LEADER_EMAIL
        sync: false
      - key: MASTER_ADMIN_EMAIL
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: UPSTASH_REDIS_REST_URL
        sync: false
      - key: UPSTASH_REDIS_REST_TOKEN
        sync: false