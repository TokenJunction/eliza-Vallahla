name: spdx-html

on:
  push:
    branches:
      - chore/spdx-headers
    paths:
      - '.github/workflows/spdx-html.yml'

permissions:
  contents: write

jobs:
  headers:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: chore/spdx-headers
          fetch-depth: 1

      - name: Add the header after each doctype
        run: node scripts/add-spdx-html.mjs

      - name: Commit the pages
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'ValhallaOS'
          git config user.email '350450408+TokenJunction@users.noreply.github.com'
          git add -- '*.html'
          if git diff --cached --quiet; then
            echo 'no HTML changed'
          else
            git commit -m "Add SPDX licence headers to the HTML pages" -m "The comment sits on the line after the doctype so the doctype stays the first token and the page keeps standards mode instead of falling into quirks mode. The Google ownership verification file is plain text, not a page, so it keeps no header."
            git push origin HEAD:chore/spdx-headers
          fi

      - name: Remove this workflow and its script
        shell: bash
        run: |
          set -euo pipefail
          git rm -q .github/workflows/spdx-html.yml scripts/add-spdx-html.mjs
          git commit -m "Remove the temporary HTML header workflow"
          git push origin HEAD:chore/spdx-headers
