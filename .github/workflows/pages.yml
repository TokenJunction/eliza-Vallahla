name: Publish Valhalla site

on:
  push:
    branches: [docs/site]

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deploy
        uses: actions/deploy-pages@v4
      - name: Custom domain and HTTPS
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api --method PUT "/repos/${{ github.repository }}/pages" -f cname=valhalla-app.xyz
          gh api --method PUT "/repos/${{ github.repository }}/pages" -f cname=valhalla-app.xyz -F https_enforced=true || echo "Enforce HTTPS after GitHub issues the certificate."
