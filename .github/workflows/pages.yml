name: Publish Valhalla site
on:
  push:
    branches: [docs/site]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: valhalla-pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Build and verify login and wallet repairs
        run: |
          python3 scripts/build-site.py
          node --check site-build/app/gate.js
          node --check site-build/errors.js
          node --check site-build/connect-core.js
          node --check site-build/site-wallet.js
          node scripts/test-wallet.cjs
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site-build
      - id: deploy
        uses: actions/deploy-pages@v4
      - name: Custom domain and HTTPS
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api --method PUT "/repos/${{ github.repository }}/pages" -f cname=valhalla-app.xyz
          gh api --method PUT "/repos/${{ github.repository }}/pages" -f cname=valhalla-app.xyz -F https_enforced=true || echo "Enforce HTTPS after GitHub issues the certificate."
