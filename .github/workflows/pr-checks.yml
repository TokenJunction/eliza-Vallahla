name: PR checks

on:
  pull_request:
    branches:
      - main
      - develop

permissions:
  contents: read

jobs:
  pr-checks:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          persist-credentials: false
      - name: Fetch the pull request branch tips
        run: |
          git fetch --no-tags --filter=blob:none --depth=50 origin "${{ github.base_ref }}"
          git fetch --no-tags --filter=blob:none --depth=50 origin "${{ github.head_ref }}:refs/remotes/origin/${{ github.head_ref }}"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install and run tests
        run: |
          npm ci
          bash website/scripts/vercel-build.sh
      - name: Reject secret patterns in public files
        run: bash scripts/pr-public-secret-scan.sh
      - name: Install gitleaks
        run: |
          curl -sSfL -o gitleaks.tar.gz https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  gitleaks.tar.gz" | sha256sum -c -
          tar -xzf gitleaks.tar.gz gitleaks
          install gitleaks /usr/local/bin/gitleaks
      - name: Fail on a secret in the pull request diff
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          if ! git merge-base "$BASE" "$HEAD" >/dev/null 2>&1; then
            echo "### Gitleaks" >> "$GITHUB_STEP_SUMMARY"
            echo "Stopped. \`$BASE\` and \`$HEAD\` were not both in the shallow branch fetch, so \`${BASE}...${HEAD}\` was not scanned. The full history was not fetched." >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          echo "merge-base $(git merge-base "$BASE" "$HEAD")"
          set +e
          gitleaks detect --source . --config .gitleaks.toml --redact --no-banner --exit-code 1 --log-opts="${BASE}...${HEAD}" > /tmp/gitleaks.txt 2>&1
          code=$?
          set -e
          {
            echo "### Gitleaks"
            echo
            echo "Range: \`${BASE}...${HEAD}\`"
            echo
            echo '```'
            cat /tmp/gitleaks.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          exit "$code"
