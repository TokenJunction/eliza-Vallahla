name: PR checks

on:
  pull_request:
    branches:
      - main
      - develop

permissions:
  contents: read

jobs:
  pr-checks:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install and run tests
        run: |
          npm ci
          bash website/scripts/vercel-build.sh
      - name: Reject secret patterns in public files
        run: bash scripts/pr-public-secret-scan.sh
      - name: Install gitleaks
        run: |
          curl -sSfL -o gitleaks.tar.gz https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz
          tar -xzf gitleaks.tar.gz gitleaks
          install gitleaks /usr/local/bin/gitleaks
      - name: Fail on a committed secret
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.sha }}
        run: |
          gitleaks detect --no-git --source . --config .gitleaks.toml --redact --no-banner --exit-code 1
          gitleaks detect --source . --config .gitleaks.toml --redact --no-banner --exit-code 1 --log-opts="${BASE_SHA}..${HEAD_SHA}"
