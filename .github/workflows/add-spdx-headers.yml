name: add-spdx-headers

on:
  push:
    branches: [chore/spdx-headers]

permissions:
  contents: write

jobs:
  headers:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Add headers
        run: python3 .github/add-spdx.py
      - name: Commit and push
        run: |
          set -eu
          git config user.name "ValhallaOS"
          git config user.email "350450408+TokenJunction@users.noreply.github.com"
          rm .github/add-spdx.py
          rm .github/workflows/add-spdx-headers.yml
          git add -A
          if git diff --cached --quiet; then
            echo "nothing to commit"
            exit 0
          fi
          git commit -m "Add SPDX licence headers to source files"
          git push origin HEAD:chore/spdx-headers
