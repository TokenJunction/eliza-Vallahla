name: Release blocker diagnosis
on:
  push:
    branches: [docs/site]
    paths: ['.github/workflows/release-blocker-diagnostic.yml']
  workflow_dispatch:
permissions:
  contents: read
  actions: read
  checks: read
  pull-requests: write
concurrency:
  group: valhalla-release-diagnostic
  cancel-in-progress: false
jobs:
  diagnose:
    if: github.repository == 'TokenJunction/eliza-valhalla' && github.ref == 'refs/heads/docs/site'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Verify pinned Pages deployment and collect delivery and CI blocker evidence
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b
        with:
          script: |
            const owner='TokenJunction',repo='eliza-valhalla',target='b3024b2e0994b509dffb7c38115a17723a244e3d';
            if(context.repo.owner!==owner||context.repo.repo!==repo||context.ref!=='refs/heads/docs/site')throw Error('Unexpected repository or branch');
            const {createHash}=require('node:crypto');
            const hash=value=>createHash('sha256').update(value).digest('hex');
            function safe(value){return String(value||'').replace(/https?:\/\/[^\s"'<>]+/g,value=>{try{const u=new URL(value);return u.origin+u.pathname;}catch{return '[url]';}}).replace(/\b(?:authorization|api[_ -]?key|secret|password)\s*[:=]\s*\S+/gi,'[redacted-credential]').replace(/[A-Za-z0-9_+\/=\-]{32,}/g,'[redacted-long-token]').replace(/[\x00-\x08\x0b\x0c\x0e-\x1f`]/g,'').slice(0,500);}
            const report={target_commit:target,diagnostic_commit:context.sha,scope:'Deployment receipts, bounded failure-log excerpts and public GET probes only; no inference, browser execution or production settings changes'};
            async function capture(name,fn){try{const value=await fn();report[name]=value;return value;}catch(e){report[name]={unavailable:true,error:safe(e.message)};return null;}}
            async function logExcerpt(job){
              const r=await github.rest.actions.downloadJobLogsForWorkflowRun({owner,repo,job_id:job.id});
              let text=typeof r.data==='string'?r.data:Buffer.isBuffer(r.data)||r.data instanceof Uint8Array?Buffer.from(r.data).toString('utf8'):r.data instanceof ArrayBuffer?Buffer.from(r.data).toString('utf8'):r.headers?.location||'';
              if(/^https:\/\//.test(text)&&!text.includes('\n')){
                const u=new URL(text);
                if(!['github.com','api.github.com'].includes(u.hostname)&&!u.hostname.endsWith('.githubusercontent.com')&&!u.hostname.endsWith('.blob.core.windows.net'))throw Error('Unexpected log download host');
                const response=await fetch(u,{redirect:'error',signal:AbortSignal.timeout(15000)});
                if(!response.ok)throw Error('Log download HTTP '+response.status);
                const reader=response.body.getReader(),decoder=new TextDecoder();let bytes=0;text='';
                try{while(true){const part=await reader.read();if(part.done)break;bytes+=part.value.byteLength;if(bytes>4194304){await reader.cancel();throw Error('Log exceeds bounded download limit');}text=(text+decoder.decode(part.value,{stream:true})).slice(-240000);}}finally{reader.releaseLock();}
              }
              if(!text)throw Error('Log text unavailable');
              const lines=text.slice(-240000).split(/\r?\n/).filter(line=>!/::add-mask::/.test(line)&&/error|failed|fatal|ENOENT|EACCES|lockfile|not found|cannot find|postinstall|bun install|Bun zip|403|404|command not found/i.test(line));
              return {job_id:job.id,job_name:safe(job.name),failed_steps:(job.steps||[]).filter(s=>s.conclusion==='failure').map(s=>({number:s.number,name:safe(s.name)})),excerpt:lines.slice(-18).map(safe),note:'Filtered tail excerpt, not complete logs; secrets and URL query strings redacted'};
            }
            async function workflow(name,sha){
              const r=await github.rest.actions.listWorkflowRuns({owner,repo,workflow_id:name,branch:'docs/site',...(sha?{head_sha:sha}:{}),per_page:5});
              const runs=r.data.workflow_runs.filter(run=>!sha||run.head_sha===sha);
              const result={runs:runs.map(run=>({id:run.id,head_sha:run.head_sha,status:run.status,conclusion:run.conclusion,html_url:run.html_url}))};
              const failed=runs.find(run=>run.conclusion==='failure');
              if(failed){const jobs=await github.rest.actions.listJobsForWorkflowRun({owner,repo,run_id:failed.id,per_page:100});const job=jobs.data.jobs.find(j=>j.conclusion==='failure');if(job)try{result.failure=await logExcerpt(job);}catch(e){result.log_error=safe(e.message);}}
              return result;
            }
            await capture('repair_pages',()=>workflow('pages.yml',target));
            await capture('current_pages',()=>workflow('pages.yml',context.sha));
            await capture('browser_diagnostic',()=>workflow('os-browser-diagnostic.yml'));
            await capture('v38_source',async()=>{
              const pr=await github.rest.pulls.get({owner,repo,pull_number:30});
              const checks=await github.rest.checks.listForRef({owner,repo,ref:pr.data.head.sha,per_page:100});
              const source=checks.data.check_runs.find(check=>check.name==='Source checks');
              if(!source)return {head_sha:pr.data.head.sha,reason:'No Source checks result on current PR head'};
              const result={head_sha:pr.data.head.sha,status:source.status,conclusion:source.conclusion,html_url:source.html_url};
              if(source.conclusion==='failure'){const u=new URL(source.html_url);const match=u.pathname.match(/^\/TokenJunction\/eliza-valhalla\/actions\/runs\/\d+\/job\/(\d+)$/);if(u.origin!=='https://github.com'||!match){result.log_error='No verified Actions job URL';return result;}const job=await github.rest.actions.getJobForWorkflowRun({owner,repo,job_id:Number(match[1])});result.failure=await logExcerpt(job.data);}
              return result;
            });
            let expected;
            await capture('adapter_source',async()=>{const r=await github.rest.repos.getContent({owner,repo,path:'os/bridge.js',ref:target});if(r.data.type!=='file'||r.data.encoding!=='base64')throw Error('Unexpected source file format');expected=hash(Buffer.from(r.data.content,'base64'));return {sha256:expected,commit:target};});
            const origins=['https://valhalla-app.xyz','https://www.valhalla-app.xyz'];
            async function probe(origin,path,kind){
              let url=new URL(path,origin);const redirects=[];
              try{
                let response;
                for(let hop=0;hop<3;hop++){
                  response=await fetch(url,{method:'GET',redirect:'manual',signal:AbortSignal.timeout(15000)});
                  if(![301,302,307,308].includes(response.status))break;
                  const location=response.headers.get('location');if(!location)break;
                  const next=new URL(location,url);
                  if(!origins.includes(next.origin)||next.pathname!==url.pathname)break;
                  redirects.push({status:response.status,to:next.origin+next.pathname});url=next;
                }
                const text=await response.text();
                const headers={};for(const name of ['server','cf-ray','cf-mitigated','cf-cache-status','content-type','x-github-request-id'])if(response.headers.has(name))headers[name]=safe(response.headers.get(name));
                const csp=response.headers.get('content-security-policy')||'';
                const result={origin,path:new URL(path,origin).pathname,kind,status:response.status,final_url:url.origin+url.pathname,redirects,headers,sha256:hash(Buffer.from(text)),challenge_marker:/cf-chl-|\/cdn-cgi\/challenge-platform\//i.test(text),title:safe(text.match(/<title[^>]*>([^<]*)<\/title>/i)?.[1]),connect_src:safe(csp.match(/(?:^|;)\s*connect-src[^;]*/i)?.[0])};
                if(kind==='adapter')result.matches_repair=response.status===200&&!!expected&&result.sha256===expected;
                if(kind==='shell'||kind==='fresh-shell')result.os_wiring=response.status===200&&text.includes('/os/app.js')&&text.includes('/os/bridge.js')&&text.includes('site-config.js');
                if(kind==='configuration'){const configured=text.match(/\bCHAT_URL\s*:\s*["']([^"']+)["']/)?.[1];result.chat_config_matches=response.status===200&&configured?.replace(/\/+$/,'')==='https://valhalla-chat.valhalla-app.workers.dev';}
                return result;
              }catch(e){return {origin,path:new URL(path,origin).pathname,kind,error:safe(e.message)};}
            }
            report.public_probes=[];
            for(const origin of origins){const nonce='?repair-verification='+encodeURIComponent(context.runId);for(const [path,kind] of [['/os/','shell'],['/os/'+nonce,'fresh-shell'],['/os/bridge.js'+nonce,'adapter'],['/site-config.js'+nonce,'configuration']])report.public_probes.push(await probe(origin,path,kind));}
            report.delivery_ready=report.public_probes.every(p=>p.status===200&&(p.kind==='adapter'?p.matches_repair:p.kind==='configuration'?p.chat_config_matches:p.os_wiring));
            report.pipeline_verified=[report.repair_pages,report.current_pages].some(result=>result?.runs?.some(run=>run.conclusion==='success'));
            report.chat_browser_ready='Not established by GET probes';
            report.run_url=context.serverUrl+'/'+owner+'/'+repo+'/actions/runs/'+context.runId;
            const rendered=JSON.stringify(report,null,2),fence=String.fromCharCode(96,96,96);
            core.info(rendered);
            await core.summary.addHeading('Pinned deployment and blocker verification').addCodeBlock(rendered,'json').write();
            await github.rest.issues.createComment({owner,repo,issue_number:29,body:['Pinned deployment verification. No production setting changes, live inference or browser-success claim.','',fence+'json',rendered,fence].join('\n')});
            if(!report.delivery_ready||!report.pipeline_verified)core.setFailed('Pages deployment, public OS delivery or deployed adapter revision remains unverified; inspect the receipt');
