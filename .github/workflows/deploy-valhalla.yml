name: Deploy Valhalla
run-name: valhalla-${{ inputs.request_id }}

on:
  workflow_dispatch:
    inputs:
      sha:
        description: Exact source commit SHA for the selected branch
        required: true
        type: string
      environment:
        description: Approved GitHub deployment environment (github-pages)
        required: true
        default: github-pages
        type: string
      request_id:
        description: Unique deployment request ID
        required: true
        type: string

permissions: {}

concurrency:
  group: valhalla-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Validate source and request
        env:
          SOURCE_SHA: ${{ inputs.sha }}
          RUN_SHA: ${{ github.sha }}
          REQUEST_ID: ${{ inputs.request_id }}
          DEPLOY_ENVIRONMENT: ${{ inputs.environment }}
          PAGES_PUBLISHER_READY: ${{ vars.VALHALLA_PAGES_PUBLISHER_READY }}
        run: |
          [[ "$SOURCE_SHA" =~ ^[0-9a-f]{40}$ && "$SOURCE_SHA" == "$RUN_SHA" ]] || { echo "Source SHA does not match workflow checkout" >&2; exit 1; }
          [[ "$REQUEST_ID" =~ ^[A-Za-z0-9_-]{1,128}$ ]] || { echo "Invalid request ID" >&2; exit 1; }
          [[ "$DEPLOY_ENVIRONMENT" == github-pages ]] || { echo "Unapproved deployment environment" >&2; exit 1; }
          [[ "$PAGES_PUBLISHER_READY" == true ]] || { echo "Pages publishing is blocked until all publishers are coordinated; set VALHALLA_PAGES_PUBLISHER_READY only after review" >&2; exit 1; }
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build and verify repository website
        run: |
          python3 website/scripts/build-site.py
          python3 website/scripts/test-site.py
          python3 tests/test_valhalla_site_release.py
          node website/scripts/test-wallet.cjs
          node --test website/scripts/gate.test.cjs website/scripts/os.test.cjs website/scripts/desk.test.cjs website/scripts/connect-page.test.cjs website/scripts/settings.test.cjs website/scripts/valos.test.cjs
      - name: Add source-correlated release marker
        env:
          SOURCE_SHA: ${{ inputs.sha }}
          REQUEST_ID: ${{ inputs.request_id }}
        run: |
          python3 scripts/write_valhalla_release.py \
            --directory site-build --sha "$SOURCE_SHA" --request-id "$REQUEST_ID"
      - uses: actions/upload-pages-artifact@v4
        with:
          path: site-build/

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      contents: read
      pages: write
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/configure-pages@v5
      - id: deployment
        uses: actions/deploy-pages@v4
      - name: Verify the custom-domain release marker
        env:
          SOURCE_SHA: ${{ inputs.sha }}
          REQUEST_ID: ${{ inputs.request_id }}
        run: python3 scripts/verify_valhalla_release.py --sha "$SOURCE_SHA" --request-id "$REQUEST_ID"
