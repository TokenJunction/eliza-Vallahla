# Separate chat Worker deployment. Keys remain server-side secrets.
# Deploy only after tests pass and real provider credentials are configured.
# Gemini fallback may incur provider charges; existing rate limits apply.
# Live voice stays disabled until authenticated token provisioning and
# browser microphone/audio integration have been verified on real devices.
name = "valhalla-chat"
main = "chat-entry.js"
compatibility_date = "2026-11-03"
workers_dev = true

[vars]
CHAT_PROVIDER = "deepseek"
CHAT_MODEL = "deepseek-chat"
CHAT_FALLBACK_PROVIDERS = "gemini"
GEMINI_MODEL = "gemini-3.8-flash"
ENABLE_GEMINI_LIVE = "false"
AUTH_CONFIG_URL = "https://valhalla-auth.valhalla-app.workers.dev"

[[ratelimits]]
name = "CHAT_LIMITER"
namespace_id = "847231"
simple = { limit = 10, period = 60 }
